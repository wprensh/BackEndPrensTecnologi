services:
  postgres:
    image: postgres:17
    container_name: cursos-postgres
    environment:
      POSTGRES_DB: cursos_en_linea
      POSTGRES_USER: cursos
      POSTGRES_PASSWORD: cursos_dev
    ports:
      - "5432:5432"
    volumes:
      - cursos-data:/var/lib/postgresql/data

volumes:
  cursos-data:
