services:
  postgres:
    image: postgres:17
    container_name: prens-postgres
    environment:
      POSTGRES_DB: prens_tecnologi
      POSTGRES_USER: prens
      POSTGRES_PASSWORD: prens_dev
    ports:
      - "5432:5432"
    volumes:
      - prens-data:/var/lib/postgresql/data

volumes:
  prens-data:
